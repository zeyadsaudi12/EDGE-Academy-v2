<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <!-- EDGE Academy Favicon -->
    <link rel="icon" type="image/jpeg" href="imges/edge-square.jpg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="imges/edge-square.jpg">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="style.css?v=20261126-v7">
    <title>تسجيل الدخول | EDGE Academy</title>
</head>

<body class="auth-body login-page">
    <header>
        <div class="header-inner">
            <!-- اليمين: شعار المنصة المتغير تلقائياً مع الثيم -->
            <!-- اليمين: شعار المنصة وزر تبديل اللغة بجانبه -->
        <div class="header-right">
            <a href="/" class="header-brand" aria-label="EDGE Academy الرئيسية">
                <img src="imges/logo-light-mode.png" alt="EDGE Academy" class="logo-img logo-light">
                <img src="imges/logo-dark-mode.png" alt="EDGE Academy" class="logo-img logo-dark">
            </a>
            <!-- زر تبديل اللغة بجانب اللوجو -->
            <button type="button" class="language-switcher" aria-label="تبديل اللغة" title="Switch Language">
                <span>EN</span>
                <svg class="lang-globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
            </button>
        </div>

            <!-- اليسار: أزرار التنقل ومحول الثيم وزر اللغة -->
            <div class="header-left">
                <nav class="header-actions">
                    <a href="register" class="btn-fill">سجل الآن</a>
                    <a href="/" class="btn-outline">الرئيسية</a>
                </nav>
                <div class="theme-capsule" aria-label="تبديل المظهر">
                    <button class="icon-btn theme-switcher" data-theme="light" aria-label="وضع النهار"
                        title="وضع النهار">☀</button>
                    <button class="icon-btn theme-switcher" data-theme="dark" aria-label="وضع الظلام"
                        title="وضع الظلام">🌙</button>
                </div>
            </div>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-left login-showcase bastahalk-showcase" aria-label="EDGE Academy">
            <div class="bastahalk-showcase-inner">
                <div class="showcase-illustration" aria-hidden="true">
                    <svg viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="loginPortalGrad" x1="140" y1="30" x2="140" y2="250" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
                                <stop offset="100%" stop-color="#d8f3ff" stop-opacity="0.9"/>
                            </linearGradient>
                            <linearGradient id="loginPortalRim" x1="80" y1="30" x2="180" y2="250" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.85"/>
                                <stop offset="100%" stop-color="#3d8ef0" stop-opacity="0.7"/>
                            </linearGradient>
                        </defs>
                        <path d="M36 105C36 97 42 91 50 91C52 84 59 80 66 81C72 82 77 87 78 93C84 94 88 99 88 105C88 112 82 117 75 117H48C41 117 36 112 36 105Z" fill="#ffffff" fill-opacity="0.16"/>
                        <path d="M196 78C196 72 201 67 207 67C209 62 214 59 220 60C224 61 228 65 229 69C234 70 237 74 237 78C237 83 233 87 227 87H205C200 87 196 83 196 78Z" fill="#ffffff" fill-opacity="0.14"/>
                        <path d="M126 36C96 36 72 60 72 90C72 109 82 126 97 136L74 244H186L163 136C178 126 188 109 188 90C188 60 164 36 134 36H126Z" fill="url(#loginPortalRim)"/>
                        <path d="M144 36C114 36 90 60 90 90C90 109 100 126 115 136L92 244H204L181 136C196 126 206 109 206 90C206 60 182 36 152 36H144Z" fill="url(#loginPortalGrad)"/>
                        <path d="M122 104C122 98 127 93 133 93C135 87 141 84 147 85C152 86 156 90 157 95C163 96 167 100 167 105C167 111 162 115 156 115H133C127 115 122 110 122 104Z" fill="#93c5fd" fill-opacity="0.45"/>
                        <path d="M110 198C110 191 116 185 123 185C126 178 133 174 140 175C146 176 151 181 152 187C159 188 164 193 164 199C164 206 158 211 151 211H123C116 211 110 205 110 198Z" fill="#93c5fd" fill-opacity="0.35"/>
                    </svg>
                </div>
                <div class="showcase-brand-block">
                    <img src="imges/logo-dark-mode.png" alt="EDGE Academy" class="showcase-logo">
                    <p class="showcase-tagline">
                        منصة متكاملة بتساعدك تذاكر صح، تختار مدرسينك ودكاترتك، وتوصل لأعلى درجاتك في المدارس والجامعات بكل سهولة وراحة.
                    </p>
                </div>
            </div>
        </section>
        <section class="auth-right login-form-panel">
            <div class="form-panel auth-card">
                <div class="auth-brand">
                    <img src="imges/logo-light-mode.png" alt="EDGE Academy"
                        class="auth-brand-logo auth-brand-logo-light">
                    <img src="imges/logo-dark-mode.png" alt="EDGE Academy" class="auth-brand-logo auth-brand-logo-dark">
                </div>
                <p class="form-subtitle">أهلاً تاني، جاهز للمذاكرة؟</p>
                <p class="form-note">ادخل رقم هاتفك وكلمة المرور المسجل بهم من قبل.</p>
                <form onsubmit="return handleLogin(event)">
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" name="phone" id="loginPhone" placeholder="رقم الهاتف" required>
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <div class="password-field">
                            <input type="password" name="password" id="loginPassword" placeholder="كلمة السر" required>
                            <button type="button" class="password-toggle"
                                onclick="togglePasswordVisibility(this)">👁️</button>
                        </div>
                    </div>
                    <button type="submit" class="btn-fill auth-submit" style="width:100%">تسجيل الدخول
                        <span>←</span></button>
                    <div id="loginFeedback" class="login-feedback" role="alert" aria-live="polite" hidden></div>
                </form>
                <p class="form-footer">ليس لديك حساب؟ <a href="register">سجل الآن</a></p>
            </div>
        </section>
    </main>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js?v=20261103-v3" defer></script>
    <script src="disable-inspect.js" defer></script>
</body>

</html>
