<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="style.css?v=1.2">
    <title>تسجيل الدخول | EDGE Academy</title>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="header-left">
                <div class="header-icons">
                    <button class="icon-btn theme-switcher" data-theme="light" aria-label="وضع النهار">☀</button>
                    <button class="icon-btn theme-switcher" data-theme="dark" aria-label="وضع الظلام">🌙</button>
                </div>
            </div>
            <nav class="header-actions">
                <a href="register" class="btn-fill">حساب جديد</a>
                <a href="/" class="btn-outline">الرئيسية</a>
            </nav>
        </div>
    </header>

    <div class="auth-page">
        <div class="auth-left">
            <img src="imges/st2.jpg" alt="شعار EDGE Academy" class="hero-image">
            <div class="auth-left-content">
                <h1>مرحباً بك مرة أخرى</h1>
                <p>ادخل بياناتك لتواصل رحلتك التعليمية مع EDGE Academy.</p>
            </div>
        </div>
        <div class="auth-right">
            <div class="form-panel">
                <div class="auth-logo"></div>
                <p class="form-subtitle">تسجيل الدخول</p>
                <p class="form-note">ادخل رقم الهاتف وكلمة المرور للدخول إلى حسابك.</p>
                <form onsubmit="return handleLogin(event)">
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" name="phone" id="loginPhone" required>
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <div class="password-field">
                            <input type="password" name="password" id="loginPassword" required>
                            <button type="button" class="password-toggle" onclick="togglePasswordVisibility(this)">👁️</button>
                        </div>
                    </div>
                    <button type="submit" class="btn-fill" style="width:100%">تسجيل الدخول</button>
                </form>
                <p class="form-footer">ليس لديك حساب؟ <a href="register">سجل الآن</a></p>
            </div>
        </div>
    </div>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js" defer></script>
    <script src="disable-inspect.js" defer></script>
</body>
</html>
