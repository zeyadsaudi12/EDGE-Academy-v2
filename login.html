<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="style.css?v=2.2">
    <title>تسجيل الدخول | EDGE Academy</title>
</head>
<body class="auth-body">
    <header>
        <div class="header-inner">
            <div class="header-left">
                <div class="header-icons">
                    <button class="icon-btn theme-switcher" data-theme="light" aria-label="وضع النهار">☀</button>
                    <button class="icon-btn theme-switcher" data-theme="dark" aria-label="وضع الظلام">🌙</button>
                </div>
            </div>
            <nav class="header-actions">
                <a href="register" class="btn-fill">حساب جديد</a>
                <a href="/" class="btn-outline">الرئيسية</a>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-left" aria-label="EDGE Academy">
            <img src="imges/st2.jpg" alt="شعار EDGE Academy" class="hero-image">
            <div class="auth-left-content">
                <span class="auth-kicker">EDGE ACADEMY</span>
                <h1>مرحباً بك مرة أخرى</h1>
                <p>ادخل بياناتك لتواصل رحلتك التعليمية مع EDGE Academy.</p>
                <div class="auth-highlights"><span>✦ محتوى متميز</span><span>✦ متابعة مستمرة</span></div>
            </div>
        </section>
        <section class="auth-right">
            <div class="form-panel auth-card">
                <div class="auth-brand"><span class="auth-brand-mark">E</span><span>EDGE Academy</span></div>
                <p class="form-subtitle">أهلاً تاني، جاهز للمذاكرة؟</p>
                <p class="form-note">ادخل رقم هاتفك وكلمة المرور المسجل بهم من قبل.</p>
                <form onsubmit="return handleLogin(event)">
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" name="phone" id="loginPhone" placeholder="رقم الهاتف" required>
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <div class="password-field">
                            <input type="password" name="password" id="loginPassword" placeholder="كلمة السر" required>
                            <button type="button" class="password-toggle" onclick="togglePasswordVisibility(this)">👁️</button>
                        </div>
                    </div>
                    <button type="submit" class="btn-fill auth-submit" style="width:100%">تسجيل الدخول <span>←</span></button>
                </form>
                <p class="form-footer">ليس لديك حساب؟ <a href="register">سجل الآن</a></p>
            </div>
        </section>
    </main>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js?v=1.5" defer></script>
    <script src="disable-inspect.js" defer></script>
</body>
</html>
