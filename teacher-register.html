<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>انضم كمعلم | EDGE Academy</title><link rel="stylesheet" href="style.css"><style>.portal{min-height:100vh;padding:45px 18px;background:linear-gradient(135deg,#edf4ff,#f7fbff)}.card{max-width:720px;margin:auto;background:#fff;padding:32px;border-radius:24px;box-shadow:0 16px 45px #174a8a1a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:7px}input,textarea{width:100%;padding:12px;border:1px solid #d6dfec;border-radius:10px;font:inherit;box-sizing:border-box}textarea{min-height:90px}.grades{display:flex;gap:8px;flex-wrap:wrap}.grades label{font-size:13px;background:#f1f6ff;padding:8px;border-radius:8px;margin:0}.grades input{width:auto}.btn{margin-top:22px;width:100%;border:0;border-radius:10px;padding:13px;background:#1769dc;color:#fff;font:700 16px inherit;cursor:pointer}.note{color:#667085;margin-bottom:24px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="portal"><section class="card"><a href="/" style="color:#1769dc;text-decoration:none">← الرئيسية</a><h1>انضم كمعلم في EDGE Academy</h1><p class="note">أنشئ حسابك، ثم تابع الفيديوهات والامتحانات ونتائج الطلاب من لوحة خاصة بك.</p><form id="form" class="grid"><div><label>الاسم بالكامل</label><input name="name" required></div><div><label>رقم الهاتف</label><input name="phone" maxlength="11" inputmode="numeric" required></div><div><label>المادة</label><input name="subjectAr" placeholder="مثال: الكيمياء" required></div><div><label>كلمة المرور</label><input name="password" type="password" required></div><div class="full"><label>الصفوف التي تدرّسها</label><div class="grades"><label><input type="checkbox" value="الصف الأول الإعدادي"> أولى إعدادي</label><label><input type="checkbox" value="الصف الثاني الإعدادي"> ثانية إعدادي</label><label><input type="checkbox" value="الصف الثالث الإعدادي"> ثالثة إعدادي</label><label><input type="checkbox" value="الصف الأول الثانوي"> أولى ثانوي</label><label><input type="checkbox" value="الصف الثاني الثانوي"> ثانية ثانوي</label><label><input type="checkbox" value="الصف الثالث الثانوي"> ثالثة ثانوي</label></div></div><div class="full"><label>نبذة مختصرة</label><textarea name="bio" placeholder="عرّف الطلاب بأسلوبك وخبرتك"></textarea></div><button class="btn full">إنشاء حساب المعلم</button></form></section></main><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),grades=[...document.querySelectorAll('.grades input:checked')].map(x=>x.value),body=Object.fromEntries(f);body.grades=grades;try{const r=await fetch('/api/teachers/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.message);localStorage.setItem('currentUser',JSON.stringify(d.user));location.href='teacher-dashboard'}catch(err){alert(err.message||'تعذر إنشاء الحساب')}}</script></body></html>
