<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة ولي الأمر | EDGE Academy</title><link rel="stylesheet" href="style.css"><style>.dash{min-height:100vh;background:#f4f7fc;padding:30px 5%}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:25px 0}.stat,.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 20px #153f7d10}.stat b{display:block;font-size:27px;color:#0f9f6e}.stat span,.muted{color:#64748b;font-size:14px}.panel{margin-top:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;text-align:right;border-bottom:1px solid #e9eef6}.filter{padding:10px;border-radius:9px;border:1px solid #d5dfed;font:inherit}.err{padding:20px;background:#fff0f0;color:#b42318;border-radius:12px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.table{font-size:12px}}</style></head><body><main class="dash"><div class="top"><div><a href="/" style="color:#1769dc">الرئيسية</a><h1 id="title">لوحة ولي الأمر</h1><p class="muted" id="student"></p></div><button onclick="localStorage.removeItem('currentParent');location.href='parent-portal'">تسجيل الخروج</button></div><div id="app">جاري تحميل بيانات الطالب...</div></main><script>const p=JSON.parse(localStorage.getItem('currentParent')||'null');if(!p)location.href='parent-portal';async function load(t=''){try{const r=await fetch('/api/parents/'+p._id+'/dashboard'+(t?'?teacherId='+encodeURIComponent(t):'')),d=await r.json();if(!r.ok)throw Error(d.message);document.querySelector('#title').textContent='متابعة '+d.student.firstName+' '+d.student.lastName;document.querySelector('#student').textContent='الصف: '+d.student.grade+' · حساب ولي الأمر: '+d.parent.name;const s=d.stats;document.querySelector('#app').innerHTML=`<section class="stats"><div class="stat"><b>${s.videos}</b><span>محاضرات مشترَك بها</span></div><div class="stat"><b>${s.courses}</b><span>كورسات مشترَك بها</span></div><div class="stat"><b>${s.exams}</b><span>امتحانات تم حلها</span></div><div class="stat"><b>${s.examAverage===null?'—':s.examAverage+'%'}</b><span>متوسط الامتحانات</span></div><div class="stat"><b>${s.attendance}</b><span>مرات الحضور</span></div></section><section class="panel"><h2>الحضور حسب المدرّس</h2><select class="filter" onchange="load(this.value)"><option value="">كل المدرسين</option>${d.teachers.map(x=>`<option value="${x._id}" ${d.selectedTeacherId===String(x._id)?'selected':''}>${esc(x.name)} — ${esc(x.subjectAr)}</option>`).join('')}</select>${table(d.attendance.map(a=>`<tr><td>${esc(a.center)}</td><td>${esc(a.day)}</td><td>${esc(a.time)}</td><td>${new Date(a.scannedAt).toLocaleDateString('ar-EG')}</td></tr>`),'<tr><th>المركز</th><th>اليوم</th><th>الوقت</th><th>التاريخ</th></tr>',4)}</section><section class="panel"><h2>نتائج الامتحانات</h2>${table(d.results.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.teacherName||'')}</td><td>${x.score||0} / ${x.total||0}</td><td>${x.percentage||0}%</td></tr>`),'<tr><th>الامتحان</th><th>المعلم</th><th>الدرجة</th><th>النسبة</th></tr>',4)}</section>`}catch(e){document.querySelector('#app').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}function table(rows,head,n){return `<table class="table"><thead>${head}</thead><tbody>${rows.join('')||'<tr><td colspan="'+n+'" class="muted">لا توجد بيانات حتى الآن.</td></tr>'}</tbody></table>`}function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}load()</script></body></html>
