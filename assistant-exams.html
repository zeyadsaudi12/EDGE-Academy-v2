<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الامتحانات والنتائج | بوابة المساعد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
    <style>
        :root {
            --bg: #0f1117;
            --bg2: #161b27;
            --surface: #1c2333;
            --surface2: #242d42;
            --border: rgba(255, 255, 255, 0.08);
            --border2: rgba(255, 255, 255, 0.14);
            --txt: #e8eaf0;
            --txt2: #a0a8bc;
            --txt3: #6b7280;
            --primary: #4f8ef7;
            --primary-glow: rgba(79, 142, 247, 0.25);
            --green: #06d6a0;
            --green-glow: rgba(6, 214, 160, 0.2);
            --gold: #dda852;
            --purple: #7b5ea7;
            --red: #ff6b6b;
            --red-glow: rgba(255, 107, 107, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--txt);
            min-height: 100vh;
            background: radial-gradient(ellipse at top, #16203a 0%, #0f1117 75%);
            display: flex;
            flex-direction: column;
        }

        /* ─── TOPBAR ─── */
        .topbar {
            background: rgba(22, 27, 39, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-hub-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--txt);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .back-hub-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(79, 142, 247, 0.08);
        }

        .topbar-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 800;
        }
        .topbar-title i {
            color: var(--green);
            font-size: 1.4rem;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-tag {
            background: rgba(79, 142, 247, 0.1);
            border: 1px solid rgba(79, 142, 247, 0.25);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logout-btn {
            background: rgba(230, 57, 70, 0.08);
            border: 1px solid rgba(230, 57, 70, 0.2);
            color: var(--red);
            padding: 7px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logout-btn:hover {
            background: rgba(230, 57, 70, 0.16);
        }

        /* ─── MAIN CONTENT ─── */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px 60px;
            flex: 1;
        }

        /* ─── FILTER BAR ─── */
        .filter-panel {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px 20px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--txt2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .select-input, .text-input {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 10px;
            padding: 9px 14px;
            color: var(--txt);
            font-family: inherit;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .select-input:focus, .text-input:focus {
            border-color: var(--primary);
        }

        .stats-strip {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .stat-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-chip strong { color: var(--green); font-size: 0.95rem; }

        /* ─── EXAMS GRID ─── */
        .exams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .exam-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }
        .exam-card:hover {
            border-color: rgba(79, 142, 247, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 16px 36px rgba(0,0,0,0.35);
        }

        .exam-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .exam-card-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--txt);
            line-height: 1.4;
        }

        .exam-subject-badge {
            background: rgba(79, 142, 247, 0.12);
            color: var(--primary);
            border: 1px solid rgba(79, 142, 247, 0.25);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .exam-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--txt2);
        }

        .exam-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--surface);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .grades-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .grade-pill {
            background: rgba(221, 168, 82, 0.1);
            border: 1px solid rgba(221, 168, 82, 0.2);
            color: var(--gold);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .exam-footer {
            margin-top: auto;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .results-count-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--txt2);
        }
        .results-count-box strong {
            color: var(--green);
            font-size: 1.05rem;
        }

        .view-results-btn {
            background: linear-gradient(135deg, var(--primary), var(--purple));
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 9px 16px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .view-results-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* ─── RESULTS PANEL (DRILL-DOWN) ─── */
        .results-section {
            display: none;
        }
        .results-section.active {
            display: block;
        }

        .results-header-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px 24px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .results-header-info h2 {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .results-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .back-to-exams-btn {
            background: var(--surface);
            border: 1px solid var(--border2);
            color: var(--txt);
            padding: 8px 16px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .back-to-exams-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .export-btn {
            background: rgba(6, 214, 160, 0.1);
            border: 1px solid rgba(6, 214, 160, 0.25);
            color: var(--green);
            padding: 8px 16px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .export-btn:hover {
            background: rgba(6, 214, 160, 0.18);
        }

        /* ─── TABLE ─── */
        .table-wrap {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 0.9rem;
        }

        thead {
            background: var(--surface);
            border-bottom: 1px solid var(--border2);
        }

        th {
            padding: 14px 16px;
            font-weight: 700;
            color: var(--txt2);
            font-size: 0.82rem;
            white-space: nowrap;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--txt);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .student-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .student-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(79, 142, 247, 0.15);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .phone-link {
            color: var(--txt2);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            direction: ltr;
        }
        .phone-link:hover { color: var(--green); }

        .score-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.85rem;
        }
        .score-high { background: rgba(6, 214, 160, 0.12); color: var(--green); }
        .score-mid { background: rgba(221, 168, 82, 0.12); color: var(--gold); }
        .score-low { background: rgba(255, 107, 107, 0.12); color: var(--red); }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .status-graded {
            background: rgba(6, 214, 160, 0.1);
            color: var(--green);
            border: 1px solid rgba(6, 214, 160, 0.25);
        }
        .status-pending {
            background: rgba(221, 168, 82, 0.1);
            color: var(--gold);
            border: 1px solid rgba(221, 168, 82, 0.25);
        }

        .actions-cell {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .btn-grade {
            background: rgba(79, 142, 247, 0.1);
            border-color: rgba(79, 142, 247, 0.25);
            color: var(--primary);
        }
        .btn-grade:hover {
            background: rgba(79, 142, 247, 0.2);
            border-color: var(--primary);
        }

        .btn-reset {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.25);
            color: var(--red);
        }
        .btn-reset:hover {
            background: rgba(255, 107, 107, 0.2);
            border-color: var(--red);
        }

        /* ─── MODAL ─── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }
        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 20px;
            width: 100%;
            max-width: 650px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            animation: modalPop 0.25s ease-out;
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-header h3 {
            font-size: 1.15rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-close-btn {
            background: transparent;
            border: none;
            color: var(--txt2);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            transition: color 0.2s;
        }
        .modal-close-btn:hover { color: var(--red); }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            background: rgba(0, 0, 0, 0.15);
        }

        .essay-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .essay-question-text {
            font-weight: 700;
            color: var(--txt);
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .student-answer-box {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            white-space: pre-wrap;
            color: var(--txt);
            line-height: 1.6;
        }
        .model-answer-box {
            font-size: 0.82rem;
            color: var(--green);
            background: rgba(6, 214, 160, 0.08);
            border: 1px solid rgba(6, 214, 160, 0.2);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 12px;
        }
        .grade-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .grade-input-row label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--txt2);
        }
        .grade-input-row input {
            width: 90px;
            padding: 7px 10px;
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 8px;
            color: var(--txt);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
            outline: none;
        }
        .grade-input-row input:focus { border-color: var(--primary); }

        /* ─── TOAST ─── */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
        }
        .toast {
            background: var(--surface2);
            border: 1px solid var(--border2);
            color: var(--txt);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideIn 0.25s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast.success { border-color: rgba(6, 214, 160, 0.4); color: var(--green); }
        .toast.error { border-color: rgba(255, 107, 107, 0.4); color: var(--red); }
        .toast.info { border-color: rgba(79, 142, 247, 0.4); color: var(--primary); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--txt2);
            grid-column: 1 / -1;
        }
        .empty-state i {
            font-size: 3rem;
            color: var(--txt3);
            margin-bottom: 14px;
            display: block;
        }
        .empty-state h3 {
            font-size: 1.15rem;
            color: var(--txt);
            margin-bottom: 6px;
        }

        @media (max-width: 768px) {
            .filter-panel { flex-direction: column; align-items: stretch; }
            .filter-group { flex-direction: column; align-items: stretch; }
            .stats-strip { justify-content: space-between; }
            .results-header-card { flex-direction: column; align-items: stretch; }
            .results-toolbar { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
    <div class="topbar-right">
        <a href="assistant-hub" class="back-hub-btn">
            <i class="ti ti-arrow-right"></i> البوابة
        </a>
        <div class="topbar-title">
            <i class="ti ti-clipboard-check"></i>
            <span>إدارة الامتحانات وتصحيح المقالي</span>
        </div>
    </div>
    <div class="topbar-left">
        <div class="user-tag">
            <i class="ti ti-user-check"></i>
            <span id="userName">المساعد</span>
        </div>
        <button class="logout-btn" onclick="doLogout()">
            <i class="ti ti-logout"></i> خروج
        </button>
    </div>
</header>

<main class="container">

    <!-- ═══ EXAMS LIST SECTION ═══ -->
    <section id="examsSection">
        <div class="filter-panel">
            <div class="filter-group">
                <div class="filter-label">
                    <i class="ti ti-filter"></i> المرحلة / الصف:
                </div>
                <select id="gradeSelect" class="select-input" onchange="applyFilters()">
                    <option value="all">كل المراحل</option>
                    <option value="الصف الأول الثانوي">الصف الأول الثانوي</option>
                    <option value="الصف الثاني الثانوي">الصف الثاني الثانوي</option>
                    <option value="الصف الثالث الثانوي">الصف الثالث الثانوي</option>
                    <option value="الصف الأول الإعدادي">الصف الأول الإعدادي</option>
                    <option value="الصف الثاني الإعدادي">الصف الثاني الإعدادي</option>
                    <option value="الصف الثالث الإعدادي">الصف الثالث الإعدادي</option>
                </select>
                <input type="text" id="searchInput" class="text-input" placeholder="بحث باسم الامتحان أو المادة..." oninput="applyFilters()">
            </div>
            <div class="stats-strip">
                <div class="stat-chip">
                    <span>عدد الامتحانات:</span>
                    <strong id="examsCount">0</strong>
                </div>
                <div class="stat-chip">
                    <span>إجمالي الإجابات:</span>
                    <strong id="totalResultsCount">0</strong>
                </div>
                <button class="back-to-exams-btn" onclick="loadExams()" title="تحديث">
                    <i class="ti ti-refresh"></i> تحديث
                </button>
            </div>
        </div>

        <div id="examsGrid" class="exams-grid">
            <div class="empty-state">
                <i class="ti ti-loader-2 ti-spin"></i>
                <h3>جاري تحميل الامتحانات...</h3>
            </div>
        </div>
    </section>

    <!-- ═══ RESULTS DRILL-DOWN SECTION ═══ -->
    <section id="resultsSection" class="results-section">
        <div class="results-header-card">
            <div class="results-header-info">
                <h2 id="activeExamTitle">
                    <i class="ti ti-file-text"></i> نتائج الامتحان
                </h2>
                <div class="exam-meta-row" id="activeExamMeta">
                    <!-- Dynamic details -->
                </div>
            </div>
            <div class="results-toolbar">
                <button class="export-btn" onclick="exportResultsCSV()">
                    <i class="ti ti-file-spreadsheet"></i> تصدير إكسيل
                </button>
                <button class="back-to-exams-btn" onclick="showExamsList()">
                    <i class="ti ti-arrow-right"></i> الرجوع لقائمة الامتحانات
                </button>
            </div>
        </div>

        <div class="filter-panel" style="margin-bottom:16px;">
            <div class="filter-group">
                <input type="text" id="studentSearchInput" class="text-input" placeholder="بحث باسم الطالب أو الهاتف..." oninput="filterResultsTable()">
                <select id="statusFilterSelect" class="select-input" onchange="filterResultsTable()">
                    <option value="all">كل الحالات</option>
                    <option value="pending">بانتظار تصحيح المقالي</option>
                    <option value="graded">تم التصحيح بالكامل</option>
                </select>
            </div>
            <div class="stats-strip">
                <div class="stat-chip">
                    <span>الطلاب الممتحنين:</span>
                    <strong id="studentsCount">0</strong>
                </div>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>الطالب</th>
                        <th>رقم الهاتف</th>
                        <th>الدرجة</th>
                        <th>النسبة</th>
                        <th>حالة التصحيح</th>
                        <th>تاريخ التسليم</th>
                        <th style="text-align:center;">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="resultsTableBody">
                    <!-- Dynamic rows -->
                </tbody>
            </table>
        </div>
    </section>

</main>

<!-- ═══ ESSAY GRADING MODAL ═══ -->
<div class="modal-overlay" id="gradeEssayModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3><i class="ti ti-checklist" style="color:var(--primary);"></i> تصحيح الأسئلة المقالية</h3>
            <button class="modal-close-btn" onclick="closeGradeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div style="background:var(--surface2); padding:10px 14px; border-radius:10px; margin-bottom:16px; font-size:0.9rem;">
                طالب: <strong id="modalStudentName" style="color:var(--primary);"></strong>
            </div>
            <div id="essayGradingFields">
                <!-- Essay questions injected here -->
            </div>
        </div>
        <div class="modal-footer">
            <button class="back-to-exams-btn" onclick="closeGradeModal()">إلغاء</button>
            <button class="view-results-btn" onclick="saveEssayGrades()">
                <i class="ti ti-device-floppy"></i> حفظ الدرجات واعتماد النتيجة
            </button>
        </div>
    </div>
</div>

<!-- ═══ CONFIRMATION MODAL ═══ -->
<div class="modal-overlay" id="confirmModal">
    <div class="modal-card" style="max-width: 440px;">
        <div class="modal-header">
            <h3 id="confirmTitle" style="color:var(--red);">تأكيد الإجراء</h3>
            <button class="modal-close-btn" onclick="closeConfirmModal()">&times;</button>
        </div>
        <div class="modal-body">
            <p id="confirmMessage" style="color:var(--txt); line-height:1.6; font-size:0.95rem;"></p>
        </div>
        <div class="modal-footer">
            <button class="back-to-exams-btn" onclick="closeConfirmModal()">تراجع</button>
            <button class="btn-action btn-reset" id="confirmActionBtn" style="padding:9px 18px;">
                تأكيد
            </button>
        </div>
    </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<script>
    // ─── AUTH & SETUP ───
    const API = window.location.origin;
    const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    const isAssistantSession = sessionStorage.getItem('assistantLoggedIn') === '1';
    const isAllowedRole = currentUser && (currentUser.role === 'assistant' || currentUser.role === 'teacher' || currentUser.role === 'admin') && !currentUser.isTeacherAccount;

    if (!isAssistantSession && !isAllowedRole) {
        alert('جلسة الدخول غير صالحة، يرجى تسجيل الدخول أولاً.');
        window.location.href = 'login';
    }

    // Set Name in Topbar
    const nameEl = document.getElementById('userName');
    if (currentUser) {
        const fullName = (currentUser.firstName || '') + ' ' + (currentUser.lastName || '') || currentUser.name || 'المساعد';
        nameEl.textContent = fullName.trim();
    }

    function doLogout() {
        localStorage.removeItem('currentUser');
        sessionStorage.removeItem('assistantLoggedIn');
        window.location.href = 'login';
    }

    // ─── STATE ───
    let allExams = [];
    let currentExam = null;
    let currentExamResults = [];
    let activeGradingStudentId = null;

    // Toast Notification Helper
    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const icon = type === 'success' ? 'ti-check' : (type === 'error' ? 'ti-alert-circle' : 'ti-info-circle');
        toast.innerHTML = `<i class="ti ${icon}"></i> <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(10px)';
            toast.style.transition = 'all 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 3500);
    }

    // ─── FETCH EXAMS ───
    async function loadExams() {
        const grid = document.getElementById('examsGrid');
        grid.innerHTML = `
            <div class="empty-state">
                <i class="ti ti-loader-2 ti-spin"></i>
                <h3>جاري تحميل الامتحانات...</h3>
            </div>
        `;

        try {
            // Build query params
            const params = new URLSearchParams();
            params.append('all', 'true'); // get active + inactive

            // If assistant is tied to a specific teacher
            if (currentUser && currentUser.teacherId) {
                params.append('teacherId', currentUser.teacherId);
            }

            const res = await fetch(`${API}/api/exams?${params.toString()}`);
            const data = await res.json();

            if (!data.success) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="ti ti-alert-triangle" style="color:var(--red);"></i>
                        <h3>تعذر تحميل الامتحانات</h3>
                        <p>${data.message || 'حدث خطأ غير متوقع'}</p>
                    </div>
                `;
                return;
            }

            allExams = data.exams || [];
            applyFilters();
        } catch (err) {
            console.error('Error loading exams:', err);
            grid.innerHTML = `
                <div class="empty-state">
                    <i class="ti ti-wifi-off" style="color:var(--red);"></i>
                    <h3>خطأ في الاتصال بالخادم</h3>
                    <p>يرجى التأكد من تشغيل الخادم والاتصال بالإنترنت</p>
                </div>
            `;
        }
    }

    // ─── FILTER & RENDER EXAMS ───
    function applyFilters() {
        const selectedGrade = document.getElementById('gradeSelect').value;
        const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

        let filtered = allExams.filter(exam => {
            // Grade match
            const matchesGrade = selectedGrade === 'all' || 
                (Array.isArray(exam.grades) && exam.grades.some(g => g.includes(selectedGrade) || selectedGrade.includes(g)));

            // Search match
            const matchesSearch = !searchVal || 
                (exam.title && exam.title.toLowerCase().includes(searchVal)) ||
                (exam.subject && exam.subject.toLowerCase().includes(searchVal));

            return matchesGrade && matchesSearch;
        });

        // Update Stats
        document.getElementById('examsCount').textContent = filtered.length;
        const totalSubmissions = filtered.reduce((sum, e) => sum + (e.resultsCount || 0), 0);
        document.getElementById('totalResultsCount').textContent = totalSubmissions;

        renderExamsGrid(filtered);
    }

    function renderExamsGrid(exams) {
        const grid = document.getElementById('examsGrid');

        if (!exams.length) {
            grid.innerHTML = `
                <div class="empty-state">
                    <i class="ti ti-notes-off"></i>
                    <h3>لا توجد امتحانات مضافة</h3>
                    <p>لم يتم العثور على امتحانات تطابق خيارات البحث الحالية</p>
                </div>
            `;
            return;
        }

        grid.innerHTML = exams.map(exam => {
            const gradesBadges = Array.isArray(exam.grades) && exam.grades.length > 0 
                ? exam.grades.map(g => `<span class="grade-pill">${g}</span>`).join('') 
                : '<span class="grade-pill">عام</span>';

            const questionsCount = Array.isArray(exam.questions) ? exam.questions.length : 0;
            const essayCount = Array.isArray(exam.questions) ? exam.questions.filter(q => q.type === 'essay').length : 0;
            const resultsCount = exam.resultsCount || 0;

            return `
                <div class="exam-card">
                    <div class="exam-card-header">
                        <div class="exam-card-title">${exam.title}</div>
                        <span class="exam-subject-badge">${exam.subject || 'عام'}</span>
                    </div>

                    <div class="grades-pills">
                        ${gradesBadges}
                    </div>

                    <div class="exam-meta-row">
                        <div class="exam-meta-item">
                            <i class="ti ti-clock"></i> ${exam.duration || 30} دقيقة
                        </div>
                        <div class="exam-meta-item">
                            <i class="ti ti-star"></i> ${exam.totalMarks || 0} درجة
                        </div>
                        <div class="exam-meta-item">
                            <i class="ti ti-help-circle"></i> ${questionsCount} سؤال
                        </div>
                        ${essayCount > 0 ? `
                        <div class="exam-meta-item" style="color:var(--gold); background:rgba(221,168,82,0.1);">
                            <i class="ti ti-pencil"></i> ${essayCount} مقالي
                        </div>
                        ` : ''}
                    </div>

                    <div class="exam-footer">
                        <div class="results-count-box">
                            <i class="ti ti-users"></i>
                            <span>الممتحنين: <strong>${resultsCount}</strong></span>
                        </div>
                        <button class="view-results-btn" onclick="openExamResults('${exam._id}')">
                            <i class="ti ti-list-details"></i> استعراض النتائج
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ─── DRILL-DOWN: OPEN RESULTS ───
    async function openExamResults(examId) {
        showToast('جاري تحميل نتائج الامتحان...', 'info');

        try {
            // Fetch complete exam with results and questions
            const res = await fetch(`${API}/api/exams/${examId}`);
            const data = await res.json();

            if (!data.success || !data.exam) {
                showToast('تعذر العثور على بيانات الامتحان', 'error');
                return;
            }

            currentExam = data.exam;
            currentExamResults = currentExam.results || [];

            // Populate active exam header
            document.getElementById('activeExamTitle').innerHTML = `
                <i class="ti ti-file-text"></i> ${currentExam.title}
                <span class="exam-subject-badge">${currentExam.subject || 'عام'}</span>
            `;

            const essayCount = (currentExam.questions || []).filter(q => q.type === 'essay').length;
            document.getElementById('activeExamMeta').innerHTML = `
                <div class="exam-meta-item"><i class="ti ti-star"></i> الدرجة الكلية: ${currentExam.totalMarks || 0}</div>
                <div class="exam-meta-item"><i class="ti ti-help-circle"></i> الأسئلة: ${(currentExam.questions || []).length}</div>
                ${essayCount > 0 ? `<div class="exam-meta-item" style="color:var(--gold);"><i class="ti ti-pencil"></i> ${essayCount} سؤال مقالي</div>` : ''}
                <div class="exam-meta-item"><i class="ti ti-calendar"></i> تاريخ الإضافة: ${new Date(currentExam.createdAt).toLocaleDateString('ar-EG')}</div>
            `;

            // Switch views
            document.getElementById('examsSection').style.display = 'none';
            document.getElementById('resultsSection').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Reset filters and render
            document.getElementById('studentSearchInput').value = '';
            document.getElementById('statusFilterSelect').value = 'all';
            filterResultsTable();

        } catch (err) {
            console.error('Error fetching exam results:', err);
            showToast('خطأ في تحميل النتائج', 'error');
        }
    }

    function showExamsList() {
        document.getElementById('resultsSection').classList.remove('active');
        document.getElementById('examsSection').style.display = 'block';
        currentExam = null;
        currentExamResults = [];
        loadExams(); // refresh count
    }

    // ─── FILTER RESULTS TABLE ───
    function filterResultsTable() {
        const query = document.getElementById('studentSearchInput').value.trim().toLowerCase();
        const status = document.getElementById('statusFilterSelect').value;

        const filtered = currentExamResults.filter(r => {
            const matchesQuery = !query ||
                (r.studentName && r.studentName.toLowerCase().includes(query)) ||
                (r.studentPhone && r.studentPhone.toLowerCase().includes(query));

            let matchesStatus = true;
            if (status === 'pending') {
                matchesStatus = r.isGraded === false;
            } else if (status === 'graded') {
                matchesStatus = r.isGraded !== false;
            }

            return matchesQuery && matchesStatus;
        });

        document.getElementById('studentsCount').textContent = filtered.length;
        renderResultsTable(filtered);
    }

    function renderResultsTable(results) {
        const tbody = document.getElementById('resultsTableBody');

        if (!results.length) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="8" style="text-align:center; padding:40px; color:var(--txt2);">
                        <i class="ti ti-user-x" style="font-size:2rem; display:block; margin-bottom:8px; color:var(--txt3);"></i>
                        لا يوجد طلاب مطابقين للبحث أو لم يقم أحد بالاختبار بعد
                    </td>
                </tr>
            `;
            return;
        }

        const hasEssayQuestions = (currentExam.questions || []).some(q => q.type === 'essay');

        tbody.innerHTML = results.map((r, index) => {
            const pct = typeof r.percentage === 'number' ? r.percentage : Math.round((r.score / (currentExam.totalMarks || 1)) * 100);
            let scoreClass = 'score-low';
            if (pct >= 75) scoreClass = 'score-high';
            else if (pct >= 50) scoreClass = 'score-mid';

            const isGraded = r.isGraded !== false;
            const statusHtml = isGraded
                ? `<span class="status-badge status-graded"><i class="ti ti-check"></i> مكتمل</span>`
                : `<span class="status-badge status-pending"><i class="ti ti-clock"></i> بانتظار المقالي</span>`;

            const dateStr = r.submittedAt ? new Date(r.submittedAt).toLocaleDateString('ar-EG', {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            }) : '-';

            const phoneClean = (r.studentPhone || '').replace(/[^0-9]/g, '');

            return `
                <tr>
                    <td style="color:var(--txt3); font-weight:700;">${index + 1}</td>
                    <td>
                        <div class="student-cell">
                            <div class="student-avatar">${(r.studentName || 'ط')[0]}</div>
                            <div>
                                <div style="font-weight:700;">${r.studentName || 'طالب مجهول'}</div>
                                <div style="font-size:0.75rem; color:var(--txt3);">${r.studentId || ''}</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        ${r.studentPhone ? `
                            <a href="https://wa.me/2${phoneClean}" target="_blank" class="phone-link" title="مراسلة عبر واتساب">
                                <i class="ti ti-brand-whatsapp" style="color:var(--green);"></i>
                                ${r.studentPhone}
                            </a>
                        ` : '<span style="color:var(--txt3);">-</span>'}
                    </td>
                    <td>
                        <span class="score-pill ${scoreClass}">
                            ${r.score || 0} / ${currentExam.totalMarks || 0}
                        </span>
                    </td>
                    <td>
                        <strong style="color:var(--txt);">${pct}%</strong>
                    </td>
                    <td>${statusHtml}</td>
                    <td style="font-size:0.8rem; color:var(--txt2);">${dateStr}</td>
                    <td>
                        <div class="actions-cell">
                            ${hasEssayQuestions ? `
                                <button class="btn-action btn-grade" onclick="openGradeModal('${r.studentId}', '${escapeHtml(r.studentName || '')}')" title="تصحيح المقالي">
                                    <i class="ti ti-checklist"></i> تصحيح
                                </button>
                            ` : ''}
                            <button class="btn-action btn-reset" onclick="confirmResetAttempt('${r.studentId}', '${escapeHtml(r.studentName || '')}')" title="السماح للطالب بإعادة الامتحان">
                                <i class="ti ti-refresh"></i> إعادة الامتحان
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function escapeHtml(text) {
        return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // ─── ESSAY GRADING MODAL ───
    function openGradeModal(studentId, studentName) {
        activeGradingStudentId = studentId;
        document.getElementById('modalStudentName').textContent = studentName;
        
        const result = currentExamResults.find(r => r.studentId === studentId);
        if (!result) {
            showToast('لم يتم العثور على إجابة الطالب', 'error');
            return;
        }

        const container = document.getElementById('essayGradingFields');
        let html = '';
        let essayIdx = 0;

        currentExam.questions.forEach((q, i) => {
            if (q.type === 'essay') {
                essayIdx++;
                const studentAns = (result.answers && result.answers[i]) ? result.answers[i] : 'لم يقدم إجابة';
                const currentScore = (result.essayScores && result.essayScores.find(s => s.questionIndex === i)?.score) || 0;

                html += `
                    <div class="essay-card">
                        <div class="essay-question-text">
                            <strong>سؤال ${essayIdx}:</strong> ${q.text}
                        </div>
                        <div class="student-answer-box">
                            <span style="font-size:0.78rem; color:var(--txt2); font-weight:700; display:block; margin-bottom:4px;">إجابة الطالب:</span>
                            ${studentAns}
                        </div>
                        ${q.correctAnswer ? `
                            <div class="model-answer-box">
                                <strong>💡 الإجابة النموذجية:</strong> ${q.correctAnswer}
                            </div>
                        ` : ''}
                        <div class="grade-input-row">
                            <label>الدرجة الممنوحة:</label>
                            <input type="number" class="essay-score-input" data-index="${i}" value="${currentScore}" min="0" step="0.5">
                        </div>
                    </div>
                `;
            }
        });

        container.innerHTML = html || '<p style="text-align:center; color:var(--txt2); padding:20px;">لا توجد أسئلة مقالية في هذا الامتحان</p>';
        document.getElementById('gradeEssayModal').classList.add('open');
    }

    function closeGradeModal() {
        document.getElementById('gradeEssayModal').classList.remove('open');
        activeGradingStudentId = null;
    }

    async function saveEssayGrades() {
        if (!currentExam || !activeGradingStudentId) return;

        const inputs = document.querySelectorAll('.essay-score-input');
        const grades = {};
        inputs.forEach(input => {
            const idx = input.getAttribute('data-index');
            grades[idx] = parseFloat(input.value) || 0;
        });

        showToast('جاري حفظ الدرجات وتحديث النتيجة...', 'info');

        try {
            const res = await fetch(`${API}/api/exams/${currentExam._id}/grade-essay`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    studentId: activeGradingStudentId,
                    grades: grades
                })
            });

            const data = await res.json();
            if (data.success) {
                showToast('تم حفظ الدرجات وتحديث النتيجة بنجاح', 'success');
                closeGradeModal();

                // Update local student in currentExamResults
                const idx = currentExamResults.findIndex(r => r.studentId === activeGradingStudentId);
                if (idx !== -1 && data.result) {
                    currentExamResults[idx] = data.result;
                }
                filterResultsTable();
            } else {
                showToast(data.message || 'فشل حفظ الدرجات', 'error');
            }
        } catch (err) {
            console.error('Error grading essays:', err);
            showToast('خطأ في الاتصال بالخادم أثناء حفظ الدرجات', 'error');
        }
    }

    // ─── RESET STUDENT ATTEMPT ───
    let pendingResetCallback = null;

    function confirmResetAttempt(studentId, studentName) {
        document.getElementById('confirmTitle').textContent = 'إعادة الامتحان للطالب';
        document.getElementById('confirmMessage').innerHTML = `
            هل أنت متأكد من حذف محاولة الطالب <strong>"${studentName}"</strong> والسماح له بإعادة هذا الامتحان مرة أخرى؟<br>
            <span style="color:var(--txt3); font-size:0.85rem; display:block; margin-top:6px;">⚠️ سيتم مسح درجته الحالية وإتاحة الامتحان له من جديد.</span>
        `;

        pendingResetCallback = async () => {
            closeConfirmModal();
            showToast('جاري إعادة تعيين محاولة الطالب...', 'info');

            try {
                const res = await fetch(`${API}/api/exams/${currentExam._id}/results/${studentId}`, {
                    method: 'DELETE'
                });

                const data = await res.json();
                if (data.success) {
                    showToast('تمت إعادة فتح الامتحان للطالب بنجاح!', 'success');
                    // Remove from local results
                    currentExamResults = currentExamResults.filter(r => r.studentId !== studentId);
                    filterResultsTable();
                } else {
                    showToast(data.message || 'تعذر إعادة تعيين الامتحان', 'error');
                }
            } catch (err) {
                console.error('Error resetting exam:', err);
                showToast('خطأ في الاتصال بالخادم', 'error');
            }
        };

        const actionBtn = document.getElementById('confirmActionBtn');
        actionBtn.onclick = pendingResetCallback;
        document.getElementById('confirmModal').classList.add('open');
    }

    function closeConfirmModal() {
        document.getElementById('confirmModal').classList.remove('open');
        pendingResetCallback = null;
    }

    // ─── EXPORT CSV ───
    function exportResultsCSV() {
        if (!currentExamResults || !currentExamResults.length) {
            showToast('لا توجد نتائج لتصديرها لهذا الامتحان', 'error');
            return;
        }

        const title = currentExam ? currentExam.title : 'نتائج_الامتحان';
        let csv = '\uFEFFم,اسم الطالب,رقم الهاتف,الدرجة,النسبة,الحالة,تاريخ التسليم\n';

        currentExamResults.forEach((r, i) => {
            const status = r.isGraded !== false ? 'تم التصحيح' : 'بانتظار تصحيح المقالي';
            const date = r.submittedAt ? new Date(r.submittedAt).toLocaleDateString('ar-EG') : '';
            const pct = typeof r.percentage === 'number' ? r.percentage : Math.round((r.score / (currentExam.totalMarks || 1)) * 100);
            csv += `${i + 1},"${r.studentName || ''}",${r.studentPhone || ''},${r.score || 0},${pct}%,${status},${date}\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `نتائج_${title}_${Date.now()}.csv`;
        a.click();
        showToast('تم تصدير ملف النتائج بنجاح', 'success');
    }

    // Initial Load
    loadExams();
</script>

</body>
</html>
