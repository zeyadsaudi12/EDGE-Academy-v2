<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المساعد - أسئلة الطلاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f1117;
            --bg2: #161b27;
            --surface: #1c2333;
            --border: rgba(255,255,255,0.08);
            --txt: #e8eaf0;
            --txt2: #a0a8bc;
            --txt3: #606880;
            --primary: #4f8ef7;
            --green: #2ca772;
            --red: #e63946;
            --gold: #dda852;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--txt);
            min-height: 100vh;
        }

        /* ─── LOGIN PAGE ─── */
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at top, #1a2540 0%, #0f1117 70%);
        }

        .login-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary), #7b5ea7);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px;
        }

        .login-card h2 { font-size: 1.5rem; margin-bottom: 6px; }
        .login-card p { color: var(--txt2); font-size: 0.9rem; margin-bottom: 30px; }

        .login-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--txt);
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            margin-bottom: 14px;
            outline: none;
            transition: border-color 0.2s;
            text-align: right;
        }
        .login-input:focus { border-color: var(--primary); }
        .login-input::placeholder { color: var(--txt3); }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), #7b5ea7);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 6px;
        }
        .login-btn:hover { opacity: 0.9; }

        .login-error {
            background: rgba(230,57,70,0.12);
            border: 1px solid rgba(230,57,70,0.3);
            color: #ff6b6b;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-top: 12px;
            display: none;
        }

        /* ─── DASHBOARD ─── */
        .topbar {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .topbar h1 { font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        .topbar h1 i { color: var(--primary); }
        .logout-btn {
            background: rgba(230,57,70,0.1);
            border: 1px solid rgba(230,57,70,0.25);
            color: #ff6b6b;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
        }

        .main { padding: 24px; max-width: 1100px; margin: 0 auto; }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .toolbar h2 { font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
        .count-badge {
            background: var(--primary);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .refresh-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--txt2);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            transition: all 0.2s;
        }
        .refresh-btn:hover { color: var(--txt); border-color: var(--primary); }

        /* Filter bar */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-bar input {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--txt);
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            outline: none;
        }
        .filter-bar input:focus { border-color: var(--primary); }
        .filter-bar input::placeholder { color: var(--txt3); }

        /* Cards grid */
        #questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }

        .q-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            transition: border-color 0.2s;
        }
        .q-card:hover { border-color: rgba(79,142,247,0.3); }
        .q-card.resolved { opacity: 0.5; }

        .q-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .q-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #7b5ea7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .q-name { font-weight: 700; font-size: 0.95rem; color: var(--txt); }
        .q-phone { font-size: 0.8rem; color: var(--txt3); direction: ltr; }
        .q-time { font-size: 0.75rem; color: var(--txt3); margin-right: auto; }

        .q-video-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(79,142,247,0.1);
            color: var(--primary);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .q-text {
            background: var(--surface);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.9rem;
            color: var(--txt);
            line-height: 1.7;
            margin-bottom: 14px;
            white-space: pre-wrap;
        }

        .q-actions { display: flex; gap: 8px; }
        .btn-wa {
            flex: 1;
            background: rgba(44,167,114,0.12);
            border: 1px solid rgba(44,167,114,0.3);
            color: var(--green);
            padding: 9px 14px;
            border-radius: 9px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-wa:hover { background: rgba(44,167,114,0.22); }
        .btn-done {
            background: rgba(221,168,82,0.1);
            border: 1px solid rgba(221,168,82,0.25);
            color: var(--gold);
            padding: 9px 14px;
            border-radius: 9px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .btn-done:hover { background: rgba(221,168,82,0.2); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--txt3);
            grid-column: 1 / -1;
        }
        .empty-state i { font-size: 3rem; margin-bottom: 12px; display: block; }

        .spinner {
            text-align: center;
            padding: 60px;
            color: var(--txt3);
            grid-column: 1 / -1;
        }

        /* Resolved badge */
        .badge-done {
            background: rgba(44,167,114,0.12);
            color: var(--green);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .main { padding: 14px; }
            #questions-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- ════════════════ LOGIN ════════════════ -->
<div class="login-wrap" id="loginPage">
    <div class="login-card">
        <div class="login-logo">🎓</div>
        <h2>بوابة المساعد</h2>
        <p>سجّل دخولك لعرض أسئلة الطلاب والرد عليها</p>

        <input type="text" class="login-input" id="assistantUser" placeholder="اسم المستخدم" />
        <input type="password" class="login-input" id="assistantPass" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter') doLogin()" />
        <button class="login-btn" onclick="doLogin()">دخول <i class="ti ti-arrow-left"></i></button>
        <div class="login-error" id="loginError">اسم المستخدم أو كلمة المرور غير صحيحة</div>
    </div>
</div>

<!-- ════════════════ DASHBOARD ════════════════ -->
<div id="dashPage" style="display:none;">
    <div class="topbar">
        <h1><i class="ti ti-messages"></i> أسئلة الطلاب — بوابة المساعد</h1>
        <div style="display:flex;align-items:center;gap:10px;">
            <span id="assistantNameDisplay" style="color:var(--txt2);font-size:0.85rem;"></span>
            <a href="assistant-hub" style="background:rgba(79,142,247,0.1);border:1px solid rgba(79,142,247,0.25);color:var(--primary);padding:8px 14px;border-radius:8px;font-size:0.82rem;text-decoration:none;display:flex;align-items:center;gap:5px;"><i class="ti ti-home"></i> الرئيسية</a>
            <button class="logout-btn" onclick="doLogout()"><i class="ti ti-logout"></i> خروج</button>
        </div>
    </div>

    <div class="main">
        <div class="toolbar">
            <h2>
                <i class="ti ti-inbox" style="color:var(--primary);"></i>
                الأسئلة الواردة
                <span class="count-badge" id="qCount">0</span>
            </h2>
            <button class="refresh-btn" onclick="loadQuestions()">
                <i class="ti ti-refresh"></i> تحديث
            </button>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="🔍  ابحث باسم الطالب أو السؤال أو اسم المحاضرة..." oninput="renderGrid()" />
        </div>

        <div id="questions-grid">
            <div class="spinner"><i class="ti ti-loader ti-spin" style="font-size:2rem;"></i><br>جاري التحميل...</div>
        </div>
    </div>
</div>

<script>
    // ══════════════ CONFIG ══════════════
    const SESSION_KEY = 'assistantLoggedIn';
    const API = window.location.origin + (window.location.pathname.includes('/masar') ? '/masar' : '');

    let allQuestions = [];
    let resolvedIds = JSON.parse(localStorage.getItem('resolvedQuestions') || '[]');

    // ══════════════ AUTH ══════════════
    // Accept: (1) DB-authenticated teacher in localStorage, OR (2) static session login
    function checkAuth() {
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
        const isTeacher = currentUser && (currentUser.role === 'assistant' || currentUser.role === 'teacher' || currentUser.role === 'admin');
        const isSession = sessionStorage.getItem(SESSION_KEY) === '1';
        return { isTeacher, isSession, currentUser };
    }

    function doLogin() {
        const ASSISTANT_ACCOUNTS = [
            { username: 'assistant', password: 'masar2024@' },
            { username: 'helper',    password: 'helper2024@' },
            { username: 'ziyad',     password: 'ziyad@masar25' }
        ];
        const user = document.getElementById('assistantUser').value.trim();
        const pass = document.getElementById('assistantPass').value;
        const match = ASSISTANT_ACCOUNTS.find(a => a.username === user && a.password === pass);
        if (match) {
            sessionStorage.setItem(SESSION_KEY, '1');
            // Also store teacher role in localStorage so attendance.html works
            if (!localStorage.getItem('currentUser')) {
                localStorage.setItem('currentUser', JSON.stringify({
                    _id: 'assistant-session-id', role: 'assistant', teacherId: null,
                    firstName: 'مساعد', lastName: 'المنصة', phone: user
                }));
            }
            showDash();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    function doLogout() {
        sessionStorage.removeItem(SESSION_KEY);
        // Only clear if it was an assistant-session account, not a real teacher
        const cu = JSON.parse(localStorage.getItem('currentUser') || 'null');
        if (cu && cu._id === 'assistant-session-id') localStorage.removeItem('currentUser');
        document.getElementById('dashPage').style.display = 'none';
        document.getElementById('loginPage').style.display = 'flex';
    }

    function showDash() {
        const { currentUser } = checkAuth();
        if (currentUser && currentUser.firstName) {
            document.getElementById('assistantNameDisplay').textContent = currentUser.firstName + ' ' + (currentUser.lastName || '');
        }
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('dashPage').style.display = 'block';
        loadQuestions();
    }

    // Auto-login if already authenticated as teacher
    const { isTeacher, isSession } = checkAuth();
    if (isTeacher || isSession) {
        showDash();
    }

    // ══════════════ DATA ══════════════
    async function loadQuestions() {
        const grid = document.getElementById('questions-grid');
        grid.innerHTML = '<div class="spinner"><i class="ti ti-loader" style="font-size:2rem;animation:spin 1s linear infinite;"></i><br>جاري التحميل...</div>';
        try {
            const { currentUser } = checkAuth();
            const userId = currentUser && currentUser._id ? currentUser._id : '';
            const res = await fetch(`${API}/api/video-questions?userId=${encodeURIComponent(userId)}`);
            const data = await res.json();
            if (data.success && Array.isArray(data.data)) {
                allQuestions = data.data;
                renderGrid();
            } else {
                grid.innerHTML = '<div class="empty-state"><i class="ti ti-alert-circle"></i>حدث خطأ في جلب الأسئلة</div>';
            }
        } catch(e) {
            grid.innerHTML = `<div class="empty-state"><i class="ti ti-wifi-off"></i>تعذّر الاتصال بالسيرفر<br><small>${e.message}</small></div>`;
        }
    }

    function renderGrid() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        let list = allQuestions;
        if (query) {
            list = list.filter(q =>
                (q.studentName || '').toLowerCase().includes(query) ||
                (q.question || '').toLowerCase().includes(query) ||
                (q.videoTitle || '').toLowerCase().includes(query) ||
                (q.studentPhone || '').includes(query)
            );
        }

        document.getElementById('qCount').textContent = list.length;

        if (list.length === 0) {
            document.getElementById('questions-grid').innerHTML = '<div class="empty-state"><i class="ti ti-messages-off"></i>لا توجد أسئلة</div>';
            return;
        }

        document.getElementById('questions-grid').innerHTML = list.map(q => {
            const initial = (q.studentName || 'ط')[0];
            const isResolved = resolvedIds.includes(q._id);
            const waText = encodeURIComponent(`أهلاً ${q.studentName}، بخصوص سؤالك عن محاضرة (${q.videoTitle}):\n"${q.question}"\n\nالرد:\n`);
            const waLink = `https://wa.me/2${q.studentPhone}?text=${waText}`;

            return `
            <div class="q-card ${isResolved ? 'resolved' : ''}" id="card-${q._id}">
                <div class="q-card-header">
                    <div class="q-avatar">${initial}</div>
                    <div style="flex:1; min-width:0;">
                        <div class="q-name">${q.studentName || 'طالب مجهول'} ${isResolved ? '<span class="badge-done">✔ تم الرد</span>' : ''}</div>
                        <div class="q-phone">${q.studentPhone || '—'}</div>
                    </div>
                    <div class="q-time">${q.createdAt || ''}</div>
                </div>
                <div class="q-video-tag"><i class="ti ti-video"></i> ${q.videoTitle || '—'}</div>
                <div class="q-text">${q.question}</div>
                <div class="q-actions">
                    <a class="btn-wa" href="${waLink}" target="_blank" onclick="markResolved('${q._id}')">
                        <i class="fab fa-whatsapp" style="font-size:1rem;"></i> رد عبر الواتساب
                    </a>
                    <button class="btn-done" onclick="markResolved('${q._id}')">
                        <i class="ti ti-check"></i> تم
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    function markResolved(id) {
        if (!resolvedIds.includes(id)) {
            resolvedIds.push(id);
            localStorage.setItem('resolvedQuestions', JSON.stringify(resolvedIds));
        }
        const card = document.getElementById('card-' + id);
        if (card) {
            card.classList.add('resolved');
            const nameEl = card.querySelector('.q-name');
            if (nameEl && !nameEl.querySelector('.badge-done')) {
                nameEl.innerHTML += ' <span class="badge-done">✔ تم الرد</span>';
            }
        }
    }

    // Auto-refresh every 60 seconds
    setInterval(loadQuestions, 60000);

    // Spin animation
    const style = document.createElement('style');
    style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
    document.head.appendChild(style);
</script>

</body>
</html>
