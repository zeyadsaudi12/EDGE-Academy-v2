<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>لوحة المدرس | EDGE Academy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root{--navy:#13294b;--blue:#1769e0;--teal:#00bfa6;--gold:#e9a93d;--ink:#17223b;--muted:#677492;--line:#e4eaf5;--soft:#f2f6ff;--white:#fff}
    *{box-sizing:border-box} body{margin:0;background:var(--soft);color:var(--ink);font-family:Tahoma,Arial,sans-serif} .nav{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,5vw);position:sticky;top:0;z-index:3}.brand{font-size:20px;font-weight:900;color:var(--navy)}.brand i{color:var(--gold)}.profile{display:flex;gap:10px;align-items:center;color:var(--muted);font-weight:700}.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#5d94ef);color:#fff;display:grid;place-items:center;font-weight:900}.logout{border:1px solid #ffc8c8;color:#c73737;background:#fff5f5;border-radius:9px;padding:9px 13px;cursor:pointer;font:inherit}.wrap{max-width:1280px;margin:30px auto;padding:0 20px}.hero{background:linear-gradient(125deg,#13294b,#1e5fbe);color:#fff;border-radius:22px;padding:28px;display:flex;gap:20px;align-items:center;justify-content:space-between}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;color:#dbe9ff}.teacher-photo{width:72px;height:72px;border-radius:16px;object-fit:cover;background:#fff}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:15px;margin:22px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px #1d3d7010}.stat{padding:18px}.stat i{font-size:22px;color:var(--blue)}.stat b{display:block;font-size:26px;margin-top:10px}.stat span{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.panel{padding:20px;margin-bottom:20px}.panel h2{font-size:18px;margin:0 0 16px}.empty{color:var(--muted);text-align:center;padding:25px}.video,.exam{border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-weight:800}.tag{background:#e7f1ff;color:#1769e0;border-radius:20px;padding:5px 9px;font-size:12px}.watchers{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:var(--muted)}details summary{cursor:pointer;color:var(--blue);font-weight:700}.people{margin-top:8px;display:grid;gap:7px}.person{background:#f7f9fd;padding:8px;border-radius:8px;color:var(--ink)}.question{border-right:4px solid var(--gold);background:#fffaf0;border-radius:8px;padding:12px;margin:9px 0;font-size:14px}.question small,.result small{display:block;color:var(--muted);margin-top:5px}.score{color:#008d77;font-weight:800}.loader{padding:70px;text-align:center;color:var(--muted)}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero{align-items:flex-start}.teacher-photo{width:56px;height:56px}}@media(max-width:480px){.nav{padding:0 14px}.brand{font-size:15px}.stats{gap:10px}.wrap{padding:0 12px}.hero{padding:20px}.hero h1{font-size:22px}}
  </style>
</head>
<body>
<nav class="nav"><div class="brand"><i class="ti ti-school"></i> EDGE Academy</div><div class="profile"><span id="account-name">حساب المدرس</span><div class="avatar" id="account-avatar">م</div><button class="logout" onclick="logout()"><i class="ti ti-logout"></i> خروج</button></div></nav>
<main class="wrap" id="app"><div class="loader"><i class="ti ti-loader-2"></i> جاري تحميل لوحة المتابعة...</div></main>
<script>
const API=window.location.origin+(window.location.pathname.includes('/masar')?'/masar':'');
const currentUser=JSON.parse(localStorage.getItem('currentUser')||'null');
function escapeHtml(v=''){const d=document.createElement('div');d.textContent=String(v);return d.innerHTML}
function logout(){localStorage.removeItem('currentUser');sessionStorage.removeItem('assistantLoggedIn');location.href='login'}
if(!currentUser||currentUser.role!=='teacher'||!currentUser.isTeacherAccount||!currentUser.teacherId){location.href='login'}
else { document.getElementById('account-name').textContent=`${currentUser.firstName||''} ${currentUser.lastName||''}`.trim()||'حساب المدرس'; document.getElementById('account-avatar').textContent=(currentUser.firstName||'م')[0]; loadDashboard(); }
async function loadDashboard(){try{const r=await fetch(`${API}/api/teachers/dashboard/${currentUser.teacherId}?userId=${currentUser._id}`);const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'تعذر تحميل البيانات');render(d)}catch(e){document.getElementById('app').innerHTML=`<div class="panel empty"><i class="ti ti-alert-circle"></i><br>${escapeHtml(e.message)}</div>`}}
function people(list){return list.length?`<div class="people">${list.map(p=>`<div class="person"><b>${escapeHtml(p.name)}</b> — ${escapeHtml(p.phone)} <small>${escapeHtml(p.grade)} · ${escapeHtml(p.governorate)}</small></div>`).join('')}</div>`:'<div class="empty">لا توجد مشاهدات حتى الآن</div>'}
function render(d){const s=d.stats,t=d.teacher;document.getElementById('app').innerHTML=`
<section class="hero"><div><h1>مرحبًا أستاذ ${escapeHtml(t.name)}</h1><p>${escapeHtml(t.subjectAr||'')} · لوحة متابعة المحتوى والطلاب</p></div>${t.imagePath?`<img class="teacher-photo" src="${escapeHtml(t.imagePath)}" alt="صورة المدرس">`:''}</section>
<section class="stats"><div class="stat"><i class="ti ti-video"></i><b>${s.videosCount}</b><span>فيديو مرفوع</span></div><div class="stat"><i class="ti ti-eye"></i><b>${s.viewersCount}</b><span>طالب شاهد المحتوى</span></div><div class="stat"><i class="ti ti-message-question"></i><b>${s.questionsCount}</b><span>سؤال من الطلاب</span></div><div class="stat"><i class="ti ti-file-description"></i><b>${s.examsCount}</b><span>امتحان مرفوع</span></div><div class="stat"><i class="ti ti-chart-bar"></i><b>${s.resultsCount}</b><span>نتيجة طالب</span></div></section>
<section class="grid"><div><section class="panel"><h2><i class="ti ti-video" style="color:var(--blue)"></i> فيديوهاتي والمشاهدات</h2>${d.videos.length?d.videos.map(v=>`<article class="video"><div class="row"><span class="title">${escapeHtml(v.title)}</span><span class="tag">${v.watchers.length} مشاهدة</span></div><div class="watchers"><details><summary>عرض أسماء الطلاب الذين شاهدوا الفيديو</summary>${people(v.watchers)}</details></div></article>`).join(''):'<div class="empty">لم يتم رفع فيديوهات بعد</div>'}</section><section class="panel"><h2><i class="ti ti-file-description" style="color:var(--teal)"></i> الامتحانات والنتائج</h2>${d.exams.length?d.exams.map(e=>`<article class="exam"><div class="row"><span class="title">${escapeHtml(e.title)}</span><span class="tag">${e.results.length} نتيجة</span></div><details class="watchers"><summary>عرض نتائج الطلاب</summary>${e.results.length?`<div class="people">${e.results.map(r=>`<div class="person result"><b>${escapeHtml(r.studentName)}</b> <span class="score">${Number(r.percentage||0)}%</span><small>${escapeHtml(r.grade)} · ${escapeHtml(r.governorate)} · ${escapeHtml(r.studentPhone||'—')}</small></div>`).join('')}</div>`:'<div class="empty">لا توجد محاولات حتى الآن</div>'}</details></article>`).join(''):'<div class="empty">لم يتم رفع امتحانات بعد</div>'}</section></div><aside><section class="panel"><h2><i class="ti ti-messages" style="color:var(--gold)"></i> أسئلة الطلاب عن الفيديوهات</h2>${d.questions.length?d.questions.map(q=>`<div class="question"><b>${escapeHtml(q.studentName||'طالب')}</b> — ${escapeHtml(q.videoTitle)}<br>${escapeHtml(q.question)}<small>${escapeHtml(q.studentPhone||'')} · ${new Date(q.createdAt).toLocaleString('ar-EG')}</small></div>`).join(''):'<div class="empty">لا توجد أسئلة حاليًا</div>'}</section></aside></section>`}
</script>
</body></html>
