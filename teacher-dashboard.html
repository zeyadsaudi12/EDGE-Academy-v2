<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المعلم | EDGE Academy</title><link rel="stylesheet" href="style.css"><style>.dash{min-height:100vh;background:#f4f7fc;padding:30px 5%}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:25px 0}.stat,.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 20px #153f7d10}.stat b{display:block;font-size:27px;color:#1769dc}.stat span{color:#64748b;font-size:14px}.panel{margin-top:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;text-align:right;border-bottom:1px solid #e9eef6}.muted{color:#64748b}.err{padding:20px;background:#fff0f0;color:#b42318;border-radius:12px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.table{font-size:12px}}</style></head><body><main class="dash"><div class="top"><div><a href="/" style="color:#1769dc">الرئيسية</a><h1 id="title">لوحة المعلم</h1><p class="muted">تابع المحتوى المنشور وتفاعل الطلاب ونتائج الامتحانات.</p></div><button onclick="localStorage.removeItem('currentUser');location.href='login'">تسجيل الخروج</button></div><div id="app">جاري تحميل اللوحة...</div></main><script>(async()=>{const u=JSON.parse(localStorage.getItem('currentUser')||'null');if(!u||u.role!=='teacher'||!u.teacherId){location.href='login';return}try{const r=await fetch('/api/teachers/'+u.teacherId+'/dashboard'),d=await r.json();if(!r.ok)throw Error(d.message);document.querySelector('#title').textContent='مرحباً أ/ '+d.teacher.name;const s=d.stats;document.querySelector('#app').innerHTML=`<section class="stats"><div class="stat"><b>${s.videos}</b><span>الفيديوهات</span></div><div class="stat"><b>${s.videoViews}</b><span>اشتراكات الفيديو</span></div><div class="stat"><b>${s.courses}</b><span>الكورسات</span></div><div class="stat"><b>${s.exams}</b><span>الامتحانات</span></div><div class="stat"><b>${s.examSubmissions}</b><span>تسليمات الامتحانات</span></div></section><section class="panel"><h2>الفيديوهات الخاصة بك</h2>${table(d.videos.map(v=>`<tr><td>${esc(v.title)}</td><td>${esc(v.playlistName||'محاضرة مستقلة')}</td><td>${v.views}</td></tr>`),'<tr><th>العنوان</th><th>الكورس</th><th>عدد المشتركين</th></tr>')}</section><section class="panel"><h2>الامتحانات والنتائج</h2>${table(d.exams.map(x=>`<tr><td>${esc(x.title)}</td><td>${x.resultsCount}</td><td>${x.average===null?'—':x.average+'%'}</td></tr>`),'<tr><th>الامتحان</th><th>عدد التسليمات</th><th>متوسط النتيجة</th></tr>')}</section>`}catch(e){document.querySelector('#app').innerHTML='<div class="err">'+esc(e.message)+'</div>'}})();function table(rows,head){return `<table class="table"><thead>${head}</thead><tbody>${rows.join('')||'<tr><td colspan="3" class="muted">لا توجد بيانات حتى الآن.</td></tr>'}</tbody></table>`}function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}</script></body></html>
