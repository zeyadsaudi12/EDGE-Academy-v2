<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة ولي الأمر | EDGE Academy</title><link rel="stylesheet" href="style.css"><style>.portal{min-height:100vh;padding:48px 18px;background:linear-gradient(135deg,#f4f8ff,#ecfdf7)}.card{max-width:850px;margin:auto;background:#fff;padding:32px;border-radius:24px;box-shadow:0 16px 45px #174a8a1a}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{padding:10px 18px;border:0;border-radius:9px;background:#edf3ff;font:inherit;font-weight:700;cursor:pointer}.tabs button.active{background:#1769dc;color:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #d6dfec;border-radius:10px;font:inherit;box-sizing:border-box}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:#1769dc;color:#fff;font:700 16px inherit;cursor:pointer}.note{color:#64748b}@media(max-width:600px){.form{grid-template-columns:1fr}}</style></head><body><main class="portal"><section class="card"><a href="/" style="color:#1769dc;text-decoration:none">← الرئيسية</a><h1>بوابة ولي الأمر</h1><p class="note">اربط حسابك بالبريد الإلكتروني المسجل للطالب، وتابع الاشتراكات والامتحانات والحضور.</p><div class="tabs"><button class="active" data-mode="register">إنشاء حساب</button><button data-mode="login">تسجيل الدخول</button></div><form id="form" class="form"><div data-register><label>اسم ولي الأمر</label><input name="name" required></div><div><label>رقم الهاتف</label><input name="phone" maxlength="11" inputmode="numeric" required></div><div data-register class="full"><label>البريد الإلكتروني المسجل للطالب</label><input name="studentEmail" type="email" placeholder="student@example.com" required></div><div><label>كلمة المرور</label><input name="password" type="password" required></div><button class="btn full" id="submit">إنشاء حساب ولي الأمر</button></form></section></main><script>let mode='register';const tabs=document.querySelectorAll('.tabs button'),registerFields=document.querySelectorAll('[data-register]');tabs.forEach(b=>b.onclick=()=>{mode=b.dataset.mode;tabs.forEach(x=>x.classList.toggle('active',x===b));registerFields.forEach(x=>x.style.display=mode==='register'?'':'none');document.querySelector('[name=name]').required=mode==='register';document.querySelector('[name=studentEmail]').required=mode==='register';document.querySelector('#submit').textContent=mode==='register'?'إنشاء حساب ولي الأمر':'تسجيل الدخول'});document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));if(mode==='login'){delete b.name;delete b.studentEmail}try{const r=await fetch('/api/parents/'+(mode==='register'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.message);localStorage.setItem('currentParent',JSON.stringify(d.parent));location.href='parent-dashboard'}catch(err){alert(err.message||'تعذر إتمام العملية')}}</script></body></html>
